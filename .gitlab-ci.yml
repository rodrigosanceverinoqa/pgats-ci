# CI de Nível 01 - Disparo manual através de clique

# estágios da pipeline
stages:
  - test

# tarefas dentro da pipeline = jobs
e2e-tests:
  # estágio ao qual o job pertence
  stage: test

  # imagem Docker com Node.js (equivalente ao runs-on + setup-node do GitHub Actions)
  image: node:24

  # regra de disparo manual (equivalente ao workflow_dispatch do GitHub Actions)
  rules:
    - when: manual

  # definir os passos do job (equivalente aos steps do GitHub Actions)
  script:
    # instalação das dependências
    - yarn

    # instalação dos browsers do Playwright
    - yarn playwright install --with-deps

    # executar os testes e2e
    - yarn run e2e
